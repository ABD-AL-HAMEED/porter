# Builds the Windows installer + portable .exe.
#   - Push a tag like v1.0.1       -> builds and publishes a GitHub Release with both .exe files
#   - Actions tab -> "Run workflow" -> builds only; download the files from the run's "Artifacts"
name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable app
        run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: porter-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
